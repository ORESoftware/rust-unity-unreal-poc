name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build src/RustEngine.Interop/RustEngine.Interop.csproj --configuration Release
      - run: dotnet run --project tests/InteropContract/InteropContract.csproj --configuration Release
