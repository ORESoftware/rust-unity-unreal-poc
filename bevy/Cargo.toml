[package]
name = "unreal-unity-bevy"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
bevy = "=0.18.1"
rust-engine = { git = "https://github.com/unreal-unity-poc/rust-engine", rev = "2c399b97e294c6c83798871512c577df6f4d4100" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
