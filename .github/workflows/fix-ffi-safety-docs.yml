name: fix FFI safety documentation

on:
  push:
    branches:
      - agent/ffi-host-e2e-ci
    paths:
      - '.github/workflows/fix-ffi-safety-docs.yml'

permissions:
  contents: write

concurrency:
  group: fix-ffi-safety-docs
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor == 'ORESoftware'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: agent/ffi-host-e2e-ci
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Document every unsafe ABI entrypoint
        shell: python
        run: |
          from pathlib import Path

          path = Path('rust-engine/src/lib.rs')
          text = path.read_text()
          replacements = {
              'pub unsafe extern "C" fn rust_engine_destroy(engine: *mut Engine) {': '''/// Destroys an engine allocated by [`rust_engine_create`].
          ///
          /// # Safety
          ///
          /// `engine` must be null or a live pointer returned by
          /// [`rust_engine_create`] that has not already been destroyed. After a
          /// non-null call returns, the pointer and every view derived from it are
          /// invalid and must not be used again.
          pub unsafe extern "C" fn rust_engine_destroy(engine: *mut Engine) {'''.replace('          ', ''),
              'pub unsafe extern "C" fn rust_engine_set_control_input(engine: *mut Engine, input: ControlInput) {': '''/// Replaces the control input consumed by later ticks.
          ///
          /// # Safety
          ///
          /// `engine` must be null or point to a live, uniquely mutable engine
          /// returned by [`rust_engine_create`]. No other thread or host callback
          /// may access the same engine while this function executes.
          pub unsafe extern "C" fn rust_engine_set_control_input(engine: *mut Engine, input: ControlInput) {'''.replace('          ', ''),
              'pub unsafe extern "C" fn rust_engine_tick(engine: *mut Engine, dt_seconds: f32) {': '''/// Advances the authoritative simulation and synchronously emits one tick event.
          ///
          /// # Safety
          ///
          /// `engine` must be null or point to a live, uniquely mutable engine.
          /// Any registered callback and its `user_data` must remain valid for the
          /// complete duration of this call and must obey its host-language ABI.
          pub unsafe extern "C" fn rust_engine_tick(engine: *mut Engine, dt_seconds: f32) {'''.replace('          ', ''),
              'pub unsafe extern "C" fn rust_engine_set_event_callback(': '''/// Registers or replaces the synchronous Rust-to-host event callback.
          ///
          /// # Safety
          ///
          /// `engine` must be null or point to a live, uniquely mutable engine.
          /// When `callback` is present, the function pointer must use the declared
          /// C ABI and `user_data` must remain valid for every later callback until
          /// the callback is cleared, replaced, or the engine is destroyed.
          pub unsafe extern "C" fn rust_engine_set_event_callback('''.replace('          ', ''),
              'pub unsafe extern "C" fn rust_engine_clear_event_callback(engine: *mut Engine) {': '''/// Clears the registered host callback without invoking it.
          ///
          /// # Safety
          ///
          /// `engine` must be null or point to a live, uniquely mutable engine.
          pub unsafe extern "C" fn rust_engine_clear_event_callback(engine: *mut Engine) {'''.replace('          ', ''),
              'pub unsafe extern "C" fn rust_engine_render_state(engine: *const Engine) -> EarthRenderState {': '''/// Copies the current render state out of the engine.
          ///
          /// # Safety
          ///
          /// `engine` must be null or point to a live engine for the duration of
          /// this call. A non-null engine must not be concurrently mutated.
          pub unsafe extern "C" fn rust_engine_render_state(engine: *const Engine) -> EarthRenderState {'''.replace('          ', ''),
              'pub unsafe extern "C" fn rust_engine_surface_patches(engine: *const Engine) -> SurfacePatchView {': '''/// Borrows the Rust-owned surface-patch array for host rendering.
          ///
          /// # Safety
          ///
          /// `engine` must be null or point to a live engine. For a non-null
          /// result, the host must treat `ptr` as read-only, must not free it, and
          /// must not retain or dereference it after the next engine mutation or
          /// after [`rust_engine_destroy`].
          pub unsafe extern "C" fn rust_engine_surface_patches(engine: *const Engine) -> SurfacePatchView {'''.replace('          ', ''),
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Verify Rust and native host boundaries
        run: |
          cargo fmt --all
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets
          bash tests/e2e/run_ffi_contract.sh
          git diff --check

      - name: Remove the one-shot workflow and commit
        run: |
          git rm .github/workflows/fix-ffi-safety-docs.yml
          git config user.name 'ORESoftware'
          git config user.email '11139560+ORESoftware@users.noreply.github.com'
          git add rust-engine/src/lib.rs
          git diff --cached --check
          git commit -m 'docs: specify safety contracts for the C ABI'
          git push origin HEAD:agent/ffi-host-e2e-ci
