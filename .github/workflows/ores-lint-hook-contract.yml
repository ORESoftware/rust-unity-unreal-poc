name: ores-lint hook contract

on:
  pull_request:
    paths:
      - '.ores-lint/install-git-hooks.sh'
      - '.ores-lint/test-git-hook-installer.sh'
      - '**/.ores-lint/install-git-hooks.sh'
      - '.github/workflows/ores-lint-hook-contract.yml'
  push:
    branches: [main]
    paths:
      - '.ores-lint/install-git-hooks.sh'
      - '.ores-lint/test-git-hook-installer.sh'
      - '**/.ores-lint/install-git-hooks.sh'
      - '.github/workflows/ores-lint-hook-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-lint-hook-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hook-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate installer shell syntax
        shell: bash
        run: |
          set -euo pipefail
          sh -n .ores-lint/install-git-hooks.sh
          sh -n .ores-lint/test-git-hook-installer.sh
          while IFS= read -r installer; do
            sh -n "$installer"
          done < <(find . -mindepth 3 -path '*/.ores-lint/install-git-hooks.sh' -type f -print | sort)

      - name: Exercise hook-path contract
        run: sh .ores-lint/test-git-hook-installer.sh
