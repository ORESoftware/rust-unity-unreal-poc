name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore src/MonoGameRustEarth/MonoGameRustEarth.csproj
      - run: dotnet build src/MonoGameRustEarth/MonoGameRustEarth.csproj --configuration Release --no-restore
